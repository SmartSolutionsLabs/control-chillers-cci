[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

build_flags =
	-D LV_CONF_SKIP
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LOG_PRINTF=1
	-D LV_MEM_CUSTOM=1
	-D LV_MEM_SIZE="(128U * 1024U)"
	-D LV_FONT_MONTSERRAT_12=1
	; General size of display or screen
	-D DSP_HOR_RES=128
	-D DSP_VER_RES=64
lib_deps =
	symlink://../SmartControllerFirmware
	robtillaart/PCF8574@^0.4.1
	olikraus/U8g2@^2.36.5
	esp32async/ESPAsyncWebServer@3.7.4
	ayushsharma82/ElegantOTA@3.1.1
	robtillaart/MCP23017@^0.9.1
	lvgl/lvgl@^9.2.2

[env:emulator]
platform = native@^1.1.3
build_flags =
	${env.build_flags}
	; -D LV_LOG_LEVEL=LV_LOG_LEVEL_INFO
	-D LV_LOG_PRINTF=1
	-lSDL2
	; SDL drivers options
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_DRV_NO_CONF
	-D LV_USE_SDL
	-D SDL_ZOOM=1
	-D LV_SDL_INCLUDE_PATH="\"SDL2/SDL.h\""

	; LVGL memory options, setup for the demo to run properly
	-D LV_MEM_CUSTOM=1
	-D LV_MEM_SIZE="(128U * 1024U)"

lib_deps =
	${env.lib_deps}

; compiled with: pio run -e emulator-windows
[env:emulator-windows]
platform = native@^1.1.3
extends = env:emulator
build_flags =
	${env:emulator.build_flags}
	-I "C:/msys64/mingw64/include"
	-L "C:/msys64/mingw64/lib"
	-D USING_WINDOWS_EMULATOR
lib_deps =
	${env:emulator.lib_deps}

[env:esp32-s3-dev]
board = esp32-s3-devkitc-1

lib_deps =
	${env.lib_deps}

build_flags =
	${env.build_flags}
	-DARDUINO_FQBN="esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=cdc,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,DebugLevel=verbose,PSRAM=enable,LoopCore=1,EventsCore=0,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default"
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MSC_ON_BOOT=0
	-DARDUINO_USB_DFU_ON_BOOT=0
	-DPSRAM_ENABLE=1
	-D__SMART_APPLICATION_WITH_WIFI__=1
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1

[env:esp32-dev]
board = esp32dev

lib_deps =
	${env.lib_deps}

build_flags =
	${env.build_flags}
